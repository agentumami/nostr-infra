# compose.yaml — nostr-infra reference stack
#
# One strfry relay + three personas (veyra, strix, kestrel).
# Each persona has its own MSISDN and its own Nostr keypair, and binds
# the two with a self-signed kind:0 profile event on first boot. The
# binding events together are the "Directory of Truth" for this mock-up
# — anyone who trusts the persona pubkeys can verify "I am Veyra, my
# phone number is +1 202-555-0147" by checking the sig on that event.
#
# See memory/2026-10-03.md and memory/2026-10-04.md for the decisions.

services:

  # --- relay ---
  # Uses the official strfry image; no local Dockerfile. We may add a
  # custom strfry.conf later (see README); for the mock-up the image
  # defaults are fine. Auth stays ON (see memory/2026-10-03.md).
  strfry:
    image: holdstockconsulting/strfry:latest
    container_name: strfry
    restart: unless-stopped
    networks:
      - nostr

  # --- persona base image ---
  # Built once locally; per-persona services build FROM it.
  persona-base:
    build:
      context: .
      dockerfile: persona-base.Dockerfile
    image: persona-base:latest
    # No CMD — it's a base. Per-persona Dockerfiles inherit ENTRYPOINT
    # from here only if they don't override it; they do override, so
    # this service exists purely to materialize the image.

  # --- personas ---
  # Same shape per persona:
  #   - build from persona-base + persona-specific Dockerfile
  #   - PERONA_NAME / PERSONA_MSISDN baked at build time
  #   - RELAY_URL points at the strfry service on the shared network
  #   - /usr/local/bin/nak bind-mounted ro from the host (the same path
  #     install-nak.sh installs to, so `nak` Just Works)
  #   - /etc/nostr/state bind-mounted rw from /etc/nostr/<persona> on
  #     the host so nsec + npub persist across restarts/rebuilds

  veyra:
    build:
      context: .
      dockerfile: veyra.Dockerfile
      args:
        PERSONA_NAME: veyra
        PERSONA_MSISDN: "+12025550147"
    container_name: veyra
    restart: unless-stopped
    environment:
      - RELAY_URL=ws://strfry:7777
    volumes:
      - /usr/local/bin/nak:/usr/local/bin/nak:ro
      - /etc/nostr/veyra:/etc/nostr/state:rw
    depends_on:
      - strfry
      - persona-base
    networks:
      - nostr

  strix:
    build:
      context: .
      dockerfile: strix.Dockerfile
      args:
        PERSONA_NAME: strix
        PERSONA_MSISDN: "+12025550183"
    container_name: strix
    restart: unless-stopped
    environment:
      - RELAY_URL=ws://strfry:7777
    volumes:
      - /usr/local/bin/nak:/usr/local/bin/nak:ro
      - /etc/nostr/strix:/etc/nostr/state:rw
    depends_on:
      - strfry
      - persona-base
    networks:
      - nostr

  kestrel:
    build:
      context: .
      dockerfile: kestrel.Dockerfile
      args:
        PERSONA_NAME: kestrel
        PERSONA_MSISDN: "+12025550196"
    container_name: kestrel
    restart: unless-stopped
    environment:
      - RELAY_URL=ws://strfry:7777
    volumes:
      - /usr/local/bin/nak:/usr/local/bin/nak:ro
      - /etc/nostr/kestrel:/etc/nostr/state:rw
    depends_on:
      - strfry
      - persona-base
    networks:
      - nostr

networks:
  nostr:
    driver: bridge
    name: nostr